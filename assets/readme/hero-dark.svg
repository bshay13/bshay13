<title id="t">Brandon Shay, AI Engineer</title>
<desc id="d">AI Engineer in Orange County, CA. I design AI systems end to end: the spec, the evals and the gates. I build with coding agents and own what ships. Loop: spec and slices (me), build with TDD (agent), tests and judges (agent), eval gate (me), approve and commit (me), with lessons feeding the next spec.</desc>
